services:
  - type: web
    name: xen-budget-tracker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xen-budget-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: xen-budget-db
    plan: free
    databaseName: xenbudget
    user: xenuser
